<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="google.css">
    <title>Google</title>
</head>
<body>
    <!-- En-tête avec les liens de navigation -->
    <header class="en-tete">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
    </header>
    
    <!-- Contenu principal de la page -->
    <main class="contenu-principal">
        <!-- Section du logo Google avec chaque lettre colorée -->
        <section class="logo-google">
            <h1 class="bleu">G</h1>
            <h1 class="rouge">o</h1>
            <h1 class="jaune">o</h1>
            <h1 class="bleu">g</h1>
            <h1 class="vert">l</h1>
            <h1 class="rouge">e</h1>
        </section>
        
        <!-- Section de recherche avec barre et icône -->
        <section class="section-recherche">
            <div class="conteneur-recherche">
                <!-- Icône de loupe dans la barre de recherche -->
                <div class="icone-recherche">🔍</div>
                <!-- Champ de saisie pour la recherche -->
                <input type="text" class="champ-recherche" placeholder="Recherche Google">
            </div>
        </section>
        
        <!-- Section des boutons de recherche -->
        <section class="section-boutons">
            <button class="bouton-recherche">Recherche Google</button>
            <button class="bouton-chance">J'ai de la chance</button>
        </section>
    </main>
    
    <!-- Pied de page avec les liens informatifs -->
    <footer class="pied-de-page">
        <div class="liens-pied-page">
            <div>
                <a href="#">Confidentialité</a>
                <a href="#">Conditions</a>
                <a href="#">Paramètres</a>
            </div>
            <div>
                <!-- Information de localisation -->
                <a href="#">Sadofé - Say - Tillabery</a>
            </div>
        </div>
    </footer>
</body>
</html>
